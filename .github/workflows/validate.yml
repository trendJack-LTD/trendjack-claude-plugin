name: Validate plugins

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The MCP checks in plugin validate need Claude Code 2.1.281 or later.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.286

      - name: Validate the marketplace and each plugin
        run: scripts/validate.sh

      - name: Check the tool names in the skills
        run: node scripts/check-tools.mjs

      - name: Check that the dev plugin matches the production plugin
        run: node scripts/build-dev.mjs --check
