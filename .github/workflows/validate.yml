name: Validate plugin

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The MCP checks in plugin validate need Claude Code 2.1.281 or later.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.286

      - name: Validate the marketplace
        run: claude plugin validate --strict .

      # A directory that holds marketplace.json validates only that file, so the plugin needs its own run.
      - name: Validate the plugin, its skills and its MCP config
        run: claude plugin validate --strict ./.claude-plugin/plugin.json

      - name: Check the tool names in the skills
        run: node scripts/check-tools.mjs
